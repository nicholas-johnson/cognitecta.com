name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [course-updated]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CALLCENTER_INGEST_URL: ${{ vars.PUBLIC_CALLCENTER_INGEST_URL }}
      PUBLIC_CALLCENTER_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CALLCENTER_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout AI Engineering course
        uses: actions/checkout@v7
        with:
          repository: nicholas-johnson/ai-with-python-course
          path: vendor/ai-with-python-course
      - name: Checkout Applied NLP course
        uses: actions/checkout@v7
        with:
          repository: nicholas-johnson/nlp-detective-agency
          path: vendor/nlp-python-course
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
